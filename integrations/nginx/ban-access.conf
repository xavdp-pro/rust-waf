# Include only in dynamic locations, before the full-body proxy include.
# Static assets keep working independently during engine outages.
auth_request /.__waf_ban_gate;
auth_request_set $waf_early_request_id $upstream_http_x_request_id;
auth_request_set $waf_ban_retry_after $upstream_http_retry_after;
error_page 500 =502 @waf_lookup_unavailable;
