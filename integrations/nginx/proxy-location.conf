# Include inside every dynamic public location; do not rewrite the URI first.
proxy_pass http://unix:/run/rust-waf/frontend.sock;
proxy_http_version 1.1;
proxy_set_header Connection close;
proxy_set_header Host $host;
proxy_set_header X-Waf-Client-IP $remote_addr;
proxy_set_header X-Waf-Admin-Friend $waf_admin_friend;
proxy_set_header X-Request-ID "";
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header CF-Connecting-IP "";
proxy_request_buffering on;
proxy_connect_timeout 2s;
proxy_send_timeout 30s;
proxy_read_timeout 65s;
proxy_next_upstream off;
proxy_cache off;
proxy_redirect off;
proxy_ignore_headers X-Accel-Redirect X-Accel-Buffering;
proxy_hide_header X-Request-ID;
